name: Collecte veille AFM

on:
  schedule:
    - cron: "17 1 * * *"   # chaque nuit vers 2h-3h heure de Paris, avant les résumés
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter
        run: python collector/collect.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enregistrer les données
        run: |
          git config user.name "robot-veille"
          git config user.email "robot-veille@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Veille du $(date +%F)"
          git pull --rebase origin main
          git push
