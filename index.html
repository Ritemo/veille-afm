<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille AFM</title>
<meta name="theme-color" content="#fbf7f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f0; --bg2:#f4ede1; --card:#ffffff; --ink:#22283a; --ink2:#5b6377; --ink3:#9299a8; --line:#ece4d6;
  --violet:#6d5ce8; --violet-l:#efecfe;
  --teal:#11a69a;   --teal-l:#e1f6f3;
  --coral:#f2604c;  --coral-l:#fde9e5;
  --sun:#f0a020;    --sun-l:#fdf2dc;
  --blue:#4a86e8;   --blue-l:#e6efff;
  --pink:#e5488d;   --pink-l:#fde6f0;
  --grey-l:#efefef;
  --shadow:0 1px 2px rgba(60,40,10,.05),0 6px 18px rgba(60,40,10,.06);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{font-family:"Nunito",system-ui,sans-serif}

.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}

/* barre latérale */
aside{position:sticky;top:0;height:100vh;padding:26px 18px 20px;display:flex;flex-direction:column;gap:6px;
  background:var(--bg2);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 18px}
.brand-logo{width:42px;height:42px;border-radius:13px;background:var(--violet);display:grid;place-items:center;box-shadow:0 6px 14px rgba(109,92,232,.3);transform:rotate(-4deg)}
.brand h1{font-size:21px;font-weight:900;letter-spacing:-.3px;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--ink3);font-weight:500;font-family:"DM Sans"}
.navi{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:13px;font-weight:600;color:var(--ink2);width:100%;text-align:left;transition:background .15s}
.navi:hover{background:rgba(255,255,255,.6)}
.navi.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.navi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.navi .ic svg{width:19px;height:19px}
.navi .cnt{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--coral);color:#fff}
.side-foot{margin-top:auto;padding:14px;border-radius:14px;background:var(--card);font-size:12.5px;color:var(--ink2);box-shadow:var(--shadow)}
.side-foot b{color:var(--ink)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:6px;animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(17,166,154,.5)}70%{box-shadow:0 0 0 8px rgba(17,166,154,0)}100%{box-shadow:0 0 0 0 rgba(17,166,154,0)}}

/* contenu */
main{padding:26px 34px 50px;max-width:1500px;width:100%}
.topbar{display:flex;gap:10px 12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.search{flex:1 1 260px;max-width:460px;min-height:42px;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;color:var(--ink3);flex:none}
.search input{border:0;outline:0;background:none;font:inherit;padding:11px 0;width:100%;color:var(--ink)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.seg button{padding:7px 14px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.seg-l{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);align-self:center;padding:0 6px 0 8px}
.switch{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--ink2);padding:0 6px}
.switch i{width:38px;height:22px;border-radius:999px;background:#ddd5c6;position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on i{background:var(--teal)}
.switch.on i::after{left:19px}

/* héros */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:28px 30px;margin-bottom:22px;
  background:linear-gradient(120deg,#6d5ce8 0%,#8f6ff0 45%,#f08a6a 100%);color:#fff;box-shadow:0 12px 30px rgba(109,92,232,.25)}
.hero h2{font-size:30px;font-weight:900;letter-spacing:-.5px}
.hero p{opacity:.92;font-size:15.5px;margin-top:4px;max-width:640px}
.hero .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero svg.tip{position:absolute;right:34px;bottom:-6px;width:230px;opacity:.95}
.wave{display:inline-block;transform-origin:70% 70%;animation:w 2.4s ease-in-out 1}
@keyframes w{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(16deg)}40%,80%{transform:rotate(-8deg)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;transition:transform .15s;cursor:pointer}
.kpi:hover{transform:translateY(-2px)}
.kpi .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:23px;height:23px}
.kpi b{font-family:"Nunito";font-size:28px;font-weight:900;line-height:1}
.kpi span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}

.synth{background:var(--card);border-radius:var(--r);padding:20px 24px;box-shadow:var(--shadow);margin-bottom:26px;position:relative}
.synth::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:0 5px 5px 0;background:var(--sun)}
.synth-h{display:flex;align-items:center;gap:9px;font-family:"Nunito";font-weight:800;font-size:17px;margin-bottom:8px}
.synth-h svg{width:22px;height:22px;color:var(--sun)}
.synth h3{font-family:"Nunito";font-size:15px;font-weight:800;margin:12px 0 4px}
.synth p{margin:5px 0;color:var(--ink2)}
.synth ul{margin:4px 0 4px 20px;color:var(--ink2)}
.synth li{margin:4px 0}
.synth strong{color:var(--ink)}
.synth a{color:var(--violet);font-weight:600}

.sec-h{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px}
.sec-h h3{font-size:20px;font-weight:900;letter-spacing:-.2px}
.sec-h small{color:var(--ink3);font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--ink2);transition:all .15s}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.6;margin-left:4px}

/* cartes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px 20px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;
  border-top:4px solid var(--c);transition:transform .15s,box-shadow .15s,opacity .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(60,40,10,.06),0 14px 30px rgba(60,40,10,.1)}
.card.lu{opacity:.55}
.c-citations{--c:var(--violet);--cl:var(--violet-l)}
.c-logiciels{--c:var(--teal);--cl:var(--teal-l)}
.c-constructeurs{--c:var(--coral);--cl:var(--coral-l)}
.c-litterature{--c:var(--sun);--cl:var(--sun-l)}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px 2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.pill svg{width:13px;height:13px}
.i4{background:var(--coral);color:#fff}
.i3{background:var(--sun-l);color:#a96600}
.i2{background:var(--blue-l);color:#2f62b8}
.i1{background:var(--grey-l);color:#7a7f8a}
.cat{background:var(--cl);color:var(--c)}
.new{background:var(--pink);color:#fff;font-size:10.5px;letter-spacing:.6px;padding:2px 9px}
.date{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.title{font-family:"Nunito";font-size:17px;font-weight:800;line-height:1.3;text-decoration:none;letter-spacing:-.1px}
.title:hover{color:var(--violet)}
.sub{font-size:13px;color:var(--ink3)}
.pm{background:var(--cl);border-radius:12px;padding:9px 12px;font-size:13.5px;color:var(--ink);display:flex;gap:9px}
.pm svg{width:18px;height:18px;color:var(--c);flex:none;margin-top:1px}
.abs{font-size:13.5px;color:var(--ink2);display:none}
.card.open .abs{display:block}
.foot{display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:9px;border-top:1px dashed var(--line)}
.rel{display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap;color:var(--ink3);margin-right:auto;cursor:help;position:relative}
.rel .bar{width:64px;height:7px;border-radius:999px;background:var(--grey-l);overflow:hidden}
.rel .bar i{display:block;height:100%;border-radius:999px;background:var(--c)}
.rel .tt{position:absolute;bottom:calc(100% + 8px);left:0;width:290px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.45;white-space:normal;
  opacity:0;pointer-events:none;transform:translateY(4px);transition:all .15s;z-index:3}
.rel:hover .tt{opacity:1;transform:none}
.act{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink3);padding:6px 9px;border-radius:9px;white-space:nowrap}
.act:hover{background:var(--bg);color:var(--ink)}
.act svg{width:16px;height:16px}
.act.on{color:var(--teal)}
.act.star.on{color:var(--pink)}

.more{display:block;margin:20px auto 0;padding:11px 22px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;color:var(--ink2)}
.empty{text-align:center;padding:60px 20px;color:var(--ink2)}
.empty svg{width:140px;margin-bottom:10px}
.empty b{display:block;font-family:"Nunito";font-size:19px;color:var(--ink);margin-bottom:4px}
.err{font-size:13px;color:var(--coral);margin:-10px 2px 18px}
.c-sorties{--c:var(--blue);--cl:var(--blue-l)}
.act.nope:hover{color:var(--coral)}
.gear{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink2);position:relative}
.gear svg{width:20px;height:20px}
.gear .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
.gear .dot.ok{background:var(--teal)}
.set p{font-size:14px;color:var(--ink2);line-height:1.55}
.set ol{font-size:13.5px;color:var(--ink2);padding-left:20px;display:flex;flex-direction:column;gap:4px}
.set input{width:100%;font:inherit;font-size:14px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.set .msg{font-size:13px;font-weight:600}
.set .msg.ok{color:#167a45}.set .msg.ko{color:var(--coral)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:600;z-index:30;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.toast button{color:#ffd36b;font-weight:700}


/* fenêtre de détail */
.card{cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(34,40,58,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.ov.on{display:flex;animation:fi .15s ease-out}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:24px;width:min(760px,100%);max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 30px 80px rgba(34,40,58,.35);
  border-top:6px solid var(--c);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(14px) scale(.98)}to{transform:none}}
.m-in{padding:24px 28px 22px;display:flex;flex-direction:column;gap:14px}
.m-x{margin-left:auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink3)}
.m-x:hover{background:var(--bg);color:var(--ink)}
.m-x svg{width:20px;height:20px}
.m-title{font-family:"Nunito";font-size:22px;font-weight:900;line-height:1.25;letter-spacing:-.2px}
.m-orig{font-size:12.5px;color:var(--ink3);margin-top:-8px;font-style:italic}
.acc{display:flex;align-items:center;gap:12px;border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600}
.acc svg{width:22px;height:22px;flex:none}
.acc small{display:block;font-weight:400;font-size:12.5px;opacity:.85}
.acc .go{margin-left:auto;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.acc-ok{background:#e3f7ec;color:#167a45}.acc-ok .go{background:#1f9d5b;color:#fff}
.acc-no{background:var(--grey-l);color:#5b6070}.acc-no .go{background:var(--ink);color:#fff}
.acc-nsp{background:var(--blue-l);color:#2f62b8}.acc-nsp .go{background:var(--blue);color:#fff}
.m-h{font-family:"Nunito";font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:-6px}
.m-sum{font-size:15px;line-height:1.6}
.m-wait{background:var(--sun-l);border-radius:12px;padding:10px 14px;font-size:13.5px;color:#8a5a00}
.m-en{font-size:13.5px;color:var(--ink2);line-height:1.55}
.m-pts{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-pts li{background:var(--bg);border-radius:12px;padding:9px 12px;font-size:13.5px}
.m-pts li b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--c);margin-bottom:1px}
.m-meta{font-size:13px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:12px}
.m-acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13.5px;text-decoration:none;background:var(--bg);color:var(--ink2)}
.btn svg{width:17px;height:17px}
.btn:hover{background:var(--bg2);color:var(--ink)}
.btn.main{background:var(--violet);color:#fff}
.btn.on{color:var(--teal)}
.btn.star.on{color:var(--pink)}
@media (max-width:700px){.m-pts{grid-template-columns:1fr}}

/* petits écrans */
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:4px;z-index:5;border-right:0;border-bottom:1px solid var(--line)}
  #nav{display:flex;gap:4px}
  .brand,.side-foot{display:none}
  .navi{width:auto;flex:none;padding:6px 10px}
  main{padding:18px 16px 40px}
  .topbar{flex-wrap:wrap}
  main{min-width:0}
  .seg button{padding:7px 10px}
  .seg-l{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:minmax(0,1fr)}
  .card{min-width:0;overflow-wrap:anywhere}
  .foot{flex-wrap:wrap}
  .rel{flex-basis:100%}
  .hero svg.tip{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 32 32" width="26" height="26"><path d="M3 24c4 0 5-6 8-6s4 4 7 4 4-9 7-9 3 5 4 5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M12.5 2.5h7l-3.5 9z" fill="#ffd36b"/></svg></div>
      <div><h1>Veille AFM</h1><small>ton radar MountainsSPIP</small></div>
    </div>
    <div id="nav"></div>
    <div class="side-foot" id="foot">Chargement…</div>
  </aside>

  <main>
    <div class="topbar">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Chercher un titre, un auteur, une revue…"></label>
      <div class="seg" id="seg"><button data-l="1">Tout</button><button data-l="3">Haute et +</button><button data-l="4">Critique</button></div>
      <div class="seg" id="sort"><span class="seg-l">Tri</span><button data-s="imp">Importance</button><button data-s="date">Date</button></div>
      <div class="seg" id="per"><span class="seg-l">Publié</span><button data-p="7">7 j</button><button data-p="30">30 j</button><button data-p="0">Tout</button></div>
      <button class="switch" id="hideRead"><i></i>Masquer les lus</button>
      <button class="gear" id="gear" title="Réglages et synchronisation"></button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
(function(){
  const P = {
    star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
    quote:'<path d="M7 7h4v4c0 3-1.5 5-4 6M15 7h4v4c0 3-1.5 5-4 6"/>',
    soft:'<rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8M6 13l4-3 3 2 5-4"/>',
    fact:'<path d="M3 20V10l6 3.5V10l6 3.5V5h6v15z"/><path d="M7 17h2M12 17h2"/>',
    book:'<path d="M4 5.5c3-1.2 6-1.2 8 .8 2-2 5-2 8-.8v13c-3-1.2-6-1.2-8 .8-2-2-5-2-8-.8z"/><path d="M12 6.3v13.5"/>',
    mark:'<path d="M6 3.5h12v17l-6-4-6 4z"/>',
    fire:'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 01-10 0c0-2.2 1-3.6 2-4.6.3 1.6 1 2.6 2 2.6-.5-3 0-5.5 1-8z"/>',
    up:'<path d="M12 19V6M6 11l6-6 6 6"/>',
    dot:'<circle cx="12" cy="12" r="4"/>',
    bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.6.5 1 1.3 1 2.2h5.2c0-.9.4-1.7 1-2.2A6 6 0 0012 3z"/>',
    chev:'<path d="M6 9l6 6 6-6"/>',
    check:'<path d="M4.5 12.5l5 5 10-11"/>',
    share:'<path d="M12 3.5v11M7.5 8L12 3.5 16.5 8M5 13.5V20h14v-6.5"/>',
    news:'<path d="M5 4h11v16H6a2 2 0 01-2-2V5a1 1 0 011-1z"/><path d="M16 8h3v10a2 2 0 01-2 2M8 8h5M8 12h5M8 16h3"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
    mtn:'<path d="M2.5 19.5l6.5-11 4 6.5 2.5-4 6 8.5z"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    open:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',
    unlock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 017.5-2"/>',
    lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
    help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2M12 17h.01"/>',
    rocket:'<path d="M5 15c-1 1-1.5 3.5-1.5 5.5 2 0 4.5-.5 5.5-1.5M9 15l-3-3c1.5-4 5-8 11.5-8.5C17 10 13 13.5 9 15z"/><circle cx="14.5" cy="9.5" r="1.5"/>',
    ban:'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',
    cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>'
  };
  const svg = (p, fill) => `<svg viewBox="0 0 24 24" fill="${fill||"none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

  const TABS = [
    {id:"une", label:"À la une", icon:P.star, c:"var(--violet)", cl:"var(--violet-l)"},
    {id:"sorties", label:"Sorties logicielles", icon:P.rocket, c:"var(--blue)", cl:"var(--blue-l)"},
    {id:"logiciels", label:"Logiciels", icon:P.soft, c:"var(--teal)", cl:"var(--teal-l)"},
    {id:"constructeurs", label:"Constructeurs", icon:P.fact, c:"var(--coral)", cl:"var(--coral-l)"},
    {id:"litterature", label:"Littérature", icon:P.book, c:"var(--sun)", cl:"var(--sun-l)"},
    {id:"creuser", label:"À creuser", icon:P.mark, c:"var(--pink)", cl:"var(--pink-l)"}
  ];
  const CAT = {citations:"Citation", sorties:"Sortie logicielle", logiciels:"Logiciel", constructeurs:"Constructeur", litterature:"Littérature"};
  const NIV = {4:["Critique",P.fire], 3:["Haute",P.up], 2:["Moyenne",P.dot], 1:["Faible",P.dot]};
  const TT = "Pertinence thématique (0 à 100), calculée par le robot : base selon la catégorie, +10 par mot-clé prioritaire, +20 si Mountains est cité, +10 revue majeure, bonus selon les citations, +20 pour une annonce produit. L'importance (Critique, Haute…) dit, elle, ce que ça change pour toi en tant que PM.";

  // état local
  const KEY = "veilleafm_v1";
  let st = {lu:{}, creuser:{}, lastVisit:"", prevVisit:"", tab:"une", hideRead:false, minImp:1, sort:"imp", period:0, exclus:{}, aEnvoyer:[], jeton:"", marques:null};
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}
  // journal des marques (lu, à creuser) avec l'heure de chaque changement, pour fusionner entre appareils
  if (!st.marques) { st.marques = {lu:{}, creuser:{}}; ["lu","creuser"].forEach(k => Object.keys(st[k]).forEach(id => st.marques[k][id] = {v:1, t:0})); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };
  const today = new Date().toISOString().slice(0,10);
  if (!TABS.some(t => t.id === st.tab)) st.tab = "une";
  if (st.lastVisit !== today) { st.prevVisit = st.lastVisit || "0000"; st.lastVisit = today; save(); }

  let resumes = {}, modalId = null;
  let items = [], meta = {}, synthese = "", group = "", q = "", shown = 30;
  const ouverts = {};
  const $ = s => document.querySelector(s);
  const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const imp = i => i.imp || 2;
  const isNew = i => i.first_seen > st.prevVisit;
  const fmt = d => d ? new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}) : "";
  const since = n => new Date(Date.now()-n*864e5).toISOString().slice(0,10);

  function md(t){
    const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[(.+?)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    let out = "", L = false;
    t.split(/\n/).forEach(l => {
      const m = l.match(/^\s*[-*]\s+(.*)/);
      if (m) { if(!L){out+="<ul>";L=true;} out += "<li>"+inl(m[1])+"</li>"; return; }
      if (L) { out+="</ul>"; L=false; }
      if (/^#+\s/.test(l)) out += "<h3>"+inl(l.replace(/^#+\s/,""))+"</h3>";
      else if (l.trim()) out += "<p>"+inl(l)+"</p>";
    });
    return out + (L ? "</ul>" : "");
  }

  function pool(){
    return pool0().filter(i => !st.exclus[i.id]);
  }
  function pool0(){
    if (st.tab === "creuser") return items.filter(i => st.creuser[i.id]);
    if (st.tab === "une") return items.filter(i => i.first_seen >= since(14) && imp(i) >= 3);
    return items.filter(i => i.cat === st.tab);
  }
  function filtered(){
    let l = pool();
    if (group) l = l.filter(i => i.group === group);
    if (st.minImp > 1) l = l.filter(i => imp(i) >= st.minImp);
    if (st.hideRead && st.tab !== "creuser") l = l.filter(i => !st.lu[i.id]);
    if (q) { const k = q.toLowerCase(); l = l.filter(i => (i.title+" "+i.authors+" "+i.venue+" "+i.abstract+" "+i.group+" "+(i.pm||"")).toLowerCase().includes(k)); }
    if (st.period) { const d = since(st.period); l = l.filter(i => (i.date || i.first_seen || "") >= d); }
    const parDate = (a,b) => (b.date||"").localeCompare(a.date||"");
    return l.slice().sort(st.sort === "date"
      ? (a,b) => parDate(a,b) || imp(b)-imp(a) || b.score-a.score
      : (a,b) => imp(b)-imp(a) || b.score-a.score || parDate(a,b));
  }

  function renderNav(){
    $("#nav").innerHTML = TABS.map(t => {
      let n = 0;
      if (t.id === "creuser") n = Object.keys(st.creuser).length;
      else if (t.id !== "une") n = items.filter(i => i.cat===t.id && isNew(i) && !st.lu[i.id] && !st.exclus[i.id]).length;
      const badge = n ? `<span class="cnt" style="${t.id==="creuser"?"background:var(--pink)":""}">${n>99?"99+":n}</span>` : "";
      return `<button class="navi ${st.tab===t.id?"on":""}" data-tab="${t.id}"><span class="ic" style="background:${t.cl};color:${t.c}">${svg(t.icon)}</span>${t.label}${badge}</button>`;
    }).join("");
    document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", +b.dataset.l === st.minImp));
    document.querySelectorAll("#sort button").forEach(b => b.classList.toggle("on", b.dataset.s === st.sort));
    document.querySelectorAll("#per button").forEach(b => b.classList.toggle("on", +b.dataset.p === st.period));
    $("#hideRead").classList.toggle("on", st.hideRead);
  }

  function card(i){
    const [nl, ni] = NIV[imp(i)];
    return `<article class="card c-${i.cat} ${st.lu[i.id]?"lu":""} ${ouverts[i.id]?"open":""}" data-id="${esc(i.id)}">
      <div class="row">
        <span class="pill i${imp(i)}">${svg(ni, imp(i)>=3?"currentColor":"none")}${nl}</span>
        <span class="pill cat">${esc(i.group || CAT[i.cat])}</span>
        ${isNew(i)?'<span class="pill new">NOUVEAU</span>':""}
        <span class="date">${fmt(i.date)}</span>
      </div>
      <a class="title" href="${esc(i.url)}" data-m="1">${esc((resumes[i.id]&&resumes[i.id].titre_fr)||i.title)}</a>
      <div class="sub">${esc([i.venue, i.authors].filter(Boolean).join(" · "))}${i.cited_by?` · ${i.cited_by} citation${i.cited_by>1?"s":""}`:""}</div>
      ${i.pm?`<div class="pm">${svg(P.bulb)}<span>${esc(i.pm)}</span></div>`:""}
      ${i.abstract?`<div class="abs">${esc(i.abstract)}</div>`:""}
      <div class="foot">
        <span class="rel"><span class="bar"><i style="width:${i.score}%"></i></span>pertinence ${i.score}<span class="tt">${TT}</span></span>
        <button class="act" data-a="open">${svg(P.chev)}Détails</button>
        <button class="act ${st.lu[i.id]?"on":""}" data-a="lu">${svg(P.check)}Lu</button>
        <button class="act star ${st.creuser[i.id]?"on":""}" data-a="creuser">${svg(P.mark, st.creuser[i.id]?"currentColor":"none")}À creuser</button>
        <button class="act" data-a="share" title="Partager">${svg(P.share)}</button>
        <button class="act nope" data-a="nope" title="Pas pertinent : retirer et apprendre">${svg(P.ban)}</button>
      </div></article>`;
  }

  function hero(){
    const h = new Date().getHours();
    const salut = h < 12 ? "Bonjour Mathieu" : h < 18 ? "Bon après-midi Mathieu" : "Bonsoir Mathieu";
    const sem = items.filter(i => i.first_seen >= since(7));
    const crit = sem.filter(i => imp(i) === 4).length;
    const phrase = !items.length ? "Le robot n'a pas encore fait son premier passage. Reviens après le prochain lancement !"
      : crit ? `${crit} élément${crit>1?"s":""} critique${crit>1?"s":""} cette semaine. On regarde ça ensemble ?`
      : sem.length ? "Semaine plutôt calme côté critiques : un bon moment pour creuser la littérature."
      : "Rien de neuf cette semaine, ton radar reste en veille.";
    const k = [
      {n:sem.length, l:"nouveautés sur 7 jours", ic:P.news, c:"var(--violet)", cl:"var(--violet-l)", go:"une"},
      {n:crit, l:"critiques à traiter", ic:P.fire, c:"var(--coral)", cl:"var(--coral-l)", go:"une"},
      {n:items.filter(i=>i.cat==="sorties").length, l:"sorties logicielles concurrentes", ic:P.rocket, c:"var(--blue)", cl:"var(--blue-l)", go:"sorties"},
      {n:items.filter(i=>i.cat==="logiciels"&&i.group==="Mountains").length, l:"publications avec Mountains", ic:P.mtn, c:"var(--teal)", cl:"var(--teal-l)", go:"logiciels"}
    ];
    return `<section class="hero">
        <div class="blob" style="width:260px;height:260px;right:-60px;top:-110px"></div>
        <div class="blob" style="width:120px;height:120px;right:300px;bottom:-70px"></div>
        <svg class="tip" viewBox="0 0 230 110" aria-hidden="true">
          <path d="M0 98 C30 98 40 70 62 70 S90 92 112 92 140 46 162 46 190 84 230 84" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="4" stroke-linecap="round"/>
          <path d="M150 4h24l-12 30z" fill="#ffd36b"/><rect x="146" y="0" width="32" height="6" rx="3" fill="#fff"/>
          <path d="M162 34 L162 42" stroke="#fff" stroke-width="2" stroke-dasharray="2 2"/>
        </svg>
        <h2>${salut} <span class="wave">👋</span></h2>
        <p>${phrase}</p>
      </section>
      <div class="kpis">${k.map(x => `<div class="kpi" data-tab="${x.go}"><span class="ic" style="background:${x.cl};color:${x.c}">${svg(x.ic)}</span><div><b>${x.n}</b><span>${x.l}</span></div></div>`).join("")}</div>
      ${meta.erreurs && meta.erreurs.length ? `<div class="err">Dernier passage du robot : ${meta.erreurs.length} source(s) n'ont pas répondu.</div>` : ""}
      ${synthese ? `<section class="synth"><div class="synth-h">${svg(P.sun)}La synthèse de la semaine</div>${md(synthese)}</section>` : ""}`;
  }

  function chips(){
    if (st.tab === "une" || st.tab === "creuser") return "";
    const c = {}; pool().forEach(i => c[i.group] = (c[i.group]||0)+1);
    const g = Object.keys(c).sort((a,b)=>c[b]-c[a]);
    if (group && !c[group]) group = "";
    if (g.length < 2) return "";
    return `<div class="chips"><button class="chip ${!group?"on":""}" data-g="">Tout<small>${pool().length}</small></button>` +
      g.map(x => `<button class="chip ${group===x?"on":""}" data-g="${esc(x)}">${esc(x)}<small>${c[x]}</small></button>`).join("") + "</div>";
  }

  const EMPTY = `<svg viewBox="0 0 140 90"><ellipse cx="70" cy="82" rx="50" ry="6" fill="#efe6d6"/><path d="M20 70 C35 70 40 50 55 50 S75 64 88 64 105 36 120 36" fill="none" stroke="#c9bfb0" stroke-width="3" stroke-linecap="round"/><path d="M98 6h22l-11 26z" fill="#6d5ce8"/><circle cx="109" cy="36" r="3" fill="#f2604c"/></svg>`;

  function render(){
    renderNav();
    const t = TABS.find(x => x.id === st.tab);
    const l = filtered();
    let h = st.tab === "une" ? hero() : "";
    const titre = st.tab === "une" ? "À traiter en priorité" : t.label;
    const tri = st.sort === "date" ? "plus récents d'abord" : "plus importants d'abord";
    const sous = (st.tab === "une" ? "importance haute et critique, repérés ces 14 derniers jours" : `${l.length} élément${l.length>1?"s":""}`) + " · " + tri;
    h += `<div class="sec-h"><h3>${titre}</h3><small>${sous}</small></div>` + chips();
    if (!l.length) h += `<div class="empty">${EMPTY}<b>${st.tab==="creuser"?"Rien à creuser pour l'instant":"Tout est calme par ici"}</b>${st.tab==="creuser"?"Clique sur « À creuser » sur une carte pour la retrouver ici.":"Change de filtre ou reviens après le prochain passage du robot."}</div>`;
    else h += `<div class="grid">${l.slice(0, shown).map(card).join("")}</div>`;
    if (l.length > shown) h += `<button class="more" id="more">Voir ${Math.min(30, l.length-shown)} de plus · ${l.length-shown} restants</button>`;
    $("#view").innerHTML = h;
    const maj = meta.maj ? new Date(meta.maj).toLocaleString("fr-FR",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}) : "pas encore";
    $("#foot").innerHTML = `<span class="pulse"></span>Robot passé <b>${maj}</b><br>${items.length} éléments suivis`;
  }

  // événements
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab]");
    if (t) { st.tab = t.dataset.tab; group = ""; shown = 30; save(); render(); scrollTo({top:0,behavior:"smooth"}); return; }
    const s = e.target.closest("#seg button");
    if (s) { st.minImp = +s.dataset.l; save(); render(); return; }
    const so = e.target.closest("#sort button");
    if (so) { st.sort = so.dataset.s; shown = 30; save(); render(); return; }
    const pe = e.target.closest("#per button");
    if (pe) { st.period = +pe.dataset.p; shown = 30; save(); render(); return; }
    const c = e.target.closest("[data-g]");
    if (c) { group = c.dataset.g; shown = 30; render(); return; }
    if (e.target.closest("#more")) { shown += 30; render(); return; }
    if (e.target.closest("#hideRead")) { st.hideRead = !st.hideRead; save(); render(); return; }
    if (e.target.closest(".m-x") || e.target === $("#ov")) { fermer(); return; }
    if (e.target.closest("#gear")) { reglages(); return; }
    if (e.target.closest("#tokSave")) { st.jeton = $("#tok").value.trim(); save(); verifier(); return; }
    if (e.target.closest("#tokDel")) { st.jeton = ""; save(); reglages(); renderGear(); return; }
    if (e.target.closest("#undo")) { annuler(); return; }
    const np = e.target.closest("[data-nope]");
    if (np) { fermer(); pasPertinent(np.dataset.nope); return; }
    const ma = e.target.closest("[data-ma]");
    if (ma) { const k = ma.dataset.ma; marquer(k, modalId, !st[k][modalId]); ouvrir(modalId); render(); return; }
    const a = e.target.closest("[data-a]");
    if (!a) {
      const cd = e.target.closest(".card");
      if (cd && !e.target.closest("a:not([data-m]),button")) { e.preventDefault(); ouvrir(cd.dataset.id); }
      return;
    }
    const el = a.closest(".card"), id = el.dataset.id, it = items.find(i => i.id === id);
    if (a.dataset.a === "open") { ouvrir(id); return; }
    if (a.dataset.a === "nope") { pasPertinent(id); return; }
    if (a.dataset.a === "share") {
      if (navigator.share) navigator.share({title: it.title, url: it.url}).catch(()=>{});
      else if (navigator.clipboard) { navigator.clipboard.writeText(it.title+"\n"+it.url); a.innerHTML = svg(P.check)+"Copié"; }
      return;
    }
    const k = a.dataset.a;
    marquer(k, id, !st[k][id]); render();
  });
  function acces(i, r){
    const lien = i.oa_url || i.url;
    const v = r && r.acces ? r.acces : (i.oa === true ? "gratuit" : i.oa === false ? "payant" : "inconnu");
    if (i.cat === "constructeurs") return `<div class="acc acc-ok">${svg(P.unlock)}<div>Actualité en accès libre<small>${esc(i.venue||"")}</small></div><a class="go" href="${esc(i.url)}" target="_blank" rel="noopener">Lire l'article</a></div>`;
    if (v === "gratuit") return `<div class="acc acc-ok">${svg(P.unlock)}<div>Disponible gratuitement<small>${esc((r&&r.acces_note)||"Version en accès libre trouvée")}</small></div><a class="go" href="${esc(lien)}" target="_blank" rel="noopener">Lire gratuitement</a></div>`;
    if (v === "payant") return `<div class="acc acc-no">${svg(P.lock)}<div>Accès payant<small>${esc((r&&r.acces_note)||"Pas de version libre repérée")}</small></div><a class="go" href="${esc(i.url)}" target="_blank" rel="noopener">Voir chez l'éditeur</a></div>`;
    return `<div class="acc acc-nsp">${svg(P.help)}<div>Accès non déterminé<small>${esc((r&&r.acces_note)||"Aucune version libre connue pour l'instant")}</small></div><a class="go" href="${esc(i.url)}" target="_blank" rel="noopener">Ouvrir la source</a></div>`;
  }
  function ouvrir(id){
    const i = items.find(x => x.id === id); if (!i) return;
    modalId = id;
    const r = resumes[id], [nl, ni] = NIV[imp(i)];
    if (!st.lu[id]) { marquer("lu", id, true); render(); }
    const pts = r && r.points && r.points.length ? `<div class="m-h">Infos utiles</div><ul class="m-pts">${r.points.map(p => { const k = p.indexOf(":"); return k>0 && k<30 ? `<li><b>${esc(p.slice(0,k))}</b>${esc(p.slice(k+1).trim())}</li>` : `<li>${esc(p)}</li>`; }).join("")}</ul>` : "";
    const corps = r && r.resume
      ? `<div class="m-h">En bref</div><div class="m-sum">${esc(r.resume)}</div>${pts}`
      : `<div class="m-wait">Le résumé en français sera préparé la nuit prochaine.</div>${i.abstract?`<div class="m-h">Extrait (anglais)</div><div class="m-en">${esc(i.abstract)}</div>`:""}`;
    $("#modal").className = "modal c-" + i.cat;
    $("#modal").innerHTML = `<div class="m-in">
      <div class="row"><span class="pill i${imp(i)}">${svg(ni, imp(i)>=3?"currentColor":"none")}${nl}</span><span class="pill cat">${esc(i.group || CAT[i.cat])}</span><span class="date" style="margin-left:4px">${fmt(i.date)}</span><button class="m-x" title="Fermer">${svg(P.x)}</button></div>
      <div class="m-title">${esc((r&&r.titre_fr)||i.title)}</div>
      ${r&&r.titre_fr?`<div class="m-orig">${esc(i.title)}</div>`:""}
      ${acces(i, r)}
      ${corps}
      ${i.pm?`<div class="pm">${svg(P.bulb)}<span><b>Pour toi :</b> ${esc((r&&r.pour_toi)||i.pm)}</span></div>`:""}
      <div class="m-meta">${esc([i.venue, i.authors].filter(Boolean).join(" · "))}${i.cited_by?` · ${i.cited_by} citation${i.cited_by>1?"s":""}`:""} · pertinence ${i.score}</div>
      <div class="m-acts">
        <a class="btn main" href="${esc(i.url)}" target="_blank" rel="noopener">${svg(P.open)}Ouvrir la source</a>
        <button class="btn star ${st.creuser[id]?"on":""}" data-ma="creuser">${svg(P.mark, st.creuser[id]?"currentColor":"none")}À creuser</button>
        <button class="btn ${st.lu[id]?"on":""}" data-ma="lu">${svg(P.check)}${st.lu[id]?"Marqué lu":"Marquer lu"}</button>
        <button class="btn" data-nope="${esc(id)}">${svg(P.ban)}Pas pertinent</button>
      </div></div>`;
    $("#ov").classList.add("on");
    document.body.style.overflow = "hidden";
  }
  // ---- « Pas pertinent » : masqué tout de suite, puis envoyé au robot via GitHub
  const DEPOT = "Ritemo/veille-afm", CHEMIN = "data/exclusions.json";
  let dernierExclu = null, toastT;
  function toast(html){
    let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
    t.innerHTML = html; t.style.display = "flex"; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", 6000);
  }
  function pasPertinent(id){
    const i = items.find(x => x.id === id); if (!i) return;
    st.exclus[id] = 1; dernierExclu = id;
    st.aEnvoyer = st.aEnvoyer.filter(x => x.id !== id).concat([{id, title:i.title, venue:i.venue||"", group:i.group||"", cat:i.cat, le:today}]);
    save(); render();
    toast(`Fiche retirée${st.jeton ? "" : " sur cet appareil"}. <button id="undo">Annuler</button>`);
    setTimeout(envoyer, 6500);
  }
  function annuler(){
    if (!dernierExclu) return;
    delete st.exclus[dernierExclu]; st.aEnvoyer = st.aEnvoyer.filter(x => x.id !== dernierExclu); dernierExclu = null;
    save(); render(); const t = $("#toast"); if (t) t.style.display = "none";
  }
  const b64e = s => btoa(unescape(encodeURIComponent(s)));
  const b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
  const gh = (url, opt={}) => fetch("https://api.github.com/repos/"+DEPOT+url, {...opt, headers:{Authorization:"Bearer "+st.jeton, Accept:"application/vnd.github+json", ...(opt.headers||{})}});
  let envoiEnCours = false;
  async function envoyer(essai=0){
    if (!st.jeton || !st.aEnvoyer.length || envoiEnCours) return;
    envoiEnCours = true;
    try {
      const r = await gh("/contents/"+CHEMIN+"?ref=main&t="+Date.now());
      let data = {ids:[], fiches:[]}, sha;
      if (r.ok) { const j = await r.json(); sha = j.sha; data = Object.assign(data, JSON.parse(b64d(j.content))); }
      else if (r.status !== 404) throw new Error(r.status);
      const lot = st.aEnvoyer.slice(), deja = new Set(data.fiches.map(x => x.id));
      lot.forEach(x => { if (!deja.has(x.id)) data.fiches.push(x); });
      const w = await gh("/contents/"+CHEMIN, {method:"PUT", body:JSON.stringify({
        message:`Pas pertinent : ${lot.length} fiche${lot.length>1?"s":""}`, branch:"main", sha,
        content:b64e(JSON.stringify(data, null, 1))})});
      if (w.status === 409 && essai < 2) { envoiEnCours = false; return envoyer(essai+1); }
      if (!w.ok) throw new Error(w.status);
      const env = new Set(lot.map(x => x.id)); st.aEnvoyer = st.aEnvoyer.filter(x => !env.has(x.id)); save();
    } catch(e) { /* on réessaiera au prochain chargement */ }
    envoiEnCours = false; renderGear();
  }
  // ---- synchronisation des marques entre appareils (data/etat.json dans le dépôt)
  const ETAT = "data/etat.json";
  let syncT, syncEnCours = false, derniereSync = "";
  function marquer(k, id, v){
    if (v) st[k][id] = 1; else delete st[k][id];
    st.marques[k][id] = {v: v ? 1 : 0, t: Date.now()};
    save(); clearTimeout(syncT); syncT = setTimeout(synchroniser, 8000);
  }
  async function synchroniser(essai=0){
    if (!st.jeton || syncEnCours) return;
    syncEnCours = true;
    try {
      const r = await gh("/contents/"+ETAT+"?ref=main&t="+Date.now());
      let distant = {lu:{}, creuser:{}}, sha;
      if (r.ok) { const j = await r.json(); sha = j.sha; Object.assign(distant, JSON.parse(b64d(j.content))); }
      else if (r.status !== 404) throw new Error(r.status);
      const avant = JSON.stringify({lu:distant.lu, creuser:distant.creuser});
      const limite = Date.now() - 120*864e5, connus = new Set(items.map(i => i.id));
      const fus = {lu:{}, creuser:{}};
      ["lu","creuser"].forEach(k => {
        const ids = new Set([...Object.keys(distant[k]||{}), ...Object.keys(st.marques[k])]);
        ids.forEach(id => {
          const a = (distant[k]||{})[id], b = st.marques[k][id];
          const m = !a ? b : !b ? a : (b.t > a.t ? b : a);
          // on oublie les fiches disparues depuis longtemps et les « non lu » anciens
          if (!connus.has(id) && m.t < limite) return;
          if (!m.v && m.t < limite) return;
          fus[k][id] = m;
        });
        st[k] = {}; Object.keys(fus[k]).forEach(id => { if (fus[k][id].v) st[k][id] = 1; });
      });
      st.marques = fus; save(); render();
      if (JSON.stringify(fus) !== avant) {
        const w = await gh("/contents/"+ETAT, {method:"PUT", body:JSON.stringify({
          message:"Synchronisation lu / à creuser", branch:"main", sha,
          content:b64e(JSON.stringify({maj:new Date().toISOString(), ...fus}))})});
        if (w.status === 409 && essai < 2) { syncEnCours = false; return synchroniser(essai+1); }
        if (!w.ok) throw new Error(w.status);
      }
      derniereSync = new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    } catch(e) { derniereSync = ""; }
    syncEnCours = false; renderGear();
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") synchroniser(); });

  function renderGear(){
    const g = $("#gear"); if (!g) return;
    g.innerHTML = svg(P.cog) + `<span class="dot ${st.jeton && !st.aEnvoyer.length ? "ok" : ""}" style="${!st.jeton && !st.aEnvoyer.length ? "display:none" : ""}"></span>`;
  }
  function reglages(){
    modalId = null;
    $("#modal").className = "modal c-sorties";
    $("#modal").innerHTML = `<div class="m-in set">
      <div class="row"><div class="m-title">Réglages</div><button class="m-x" title="Fermer">${svg(P.x)}</button></div>
      <p>Avec un jeton GitHub, tes fiches <b>lues</b> et <b>À creuser</b> sont partagées entre tous tes appareils (fichier data/etat.json du dépôt, public comme le reste : il ne contient que des identifiants de fiches).</p>
      <p>Le bouton <b>Pas pertinent</b> masque une fiche tout de suite. Pour que le robot l'écarte aussi (et écarte une revue ou un média après deux refus), l'appli doit pouvoir écrire dans ton dépôt GitHub.</p>
      ${st.jeton ? `<div class="acc acc-ok">${svg(P.check)}<div>Connecté à GitHub<small>${st.aEnvoyer.length ? st.aEnvoyer.length+" fiche(s) en attente d'envoi" : (derniereSync ? "Lu et À creuser synchronisés à "+derniereSync : "Synchronisation en cours…")}</small></div><button class="go" id="tokDel" style="border:0">Déconnecter</button></div>` : `
      <ol><li>Sur GitHub : Settings, Developer settings, Personal access tokens, <b>Fine-grained tokens</b>, Generate new token.</li>
      <li>Repository access : <b>Only select repositories</b>, choisis <b>Ritemo/veille-afm</b>.</li>
      <li>Permissions : <b>Contents</b> en <b>Read and write</b>. Rien d'autre.</li>
      <li>Colle le jeton ici. Il reste dans ce navigateur, à refaire sur chaque appareil.</li></ol>
      <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off">
      <div class="m-acts"><button class="btn main" id="tokSave">${svg(P.check)}Enregistrer</button></div>`}
      <div class="msg" id="tokMsg"></div>
      ${Object.keys(st.exclus).length ? `<p>${Object.keys(st.exclus).length} fiche(s) marquée(s) pas pertinente(s) sur cet appareil.</p>` : ""}
    </div>`;
    $("#ov").classList.add("on"); document.body.style.overflow = "hidden";
  }
  async function verifier(){
    const m = $("#tokMsg"); m.className = "msg"; m.textContent = "Vérification…";
    try {
      const r = await gh("");
      const j = r.ok ? await r.json() : null;
      if (!j || !j.permissions || !j.permissions.push) throw 0;
      reglages(); renderGear(); envoyer(); synchroniser();
      const m2 = $("#tokMsg"); m2.className = "msg ok"; m2.textContent = "C'est bon : les prochains « Pas pertinent » iront au robot.";
    } catch(e) { st.jeton = ""; save(); m.className = "msg ko"; m.textContent = "Ce jeton ne permet pas d'écrire dans Ritemo/veille-afm. Vérifie l'accès au dépôt et la permission Contents."; renderGear(); }
  }

  function fermer(){ $("#ov").classList.remove("on"); document.body.style.overflow = ""; modalId = null; }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && modalId) fermer(); });

  let tq; $("#q").addEventListener("input", e => { clearTimeout(tq); tq = setTimeout(() => { q = e.target.value.trim(); shown = 30; render(); }, 150); });

  // chargement
  const v = "?t=" + Date.now();
  Promise.all([
    fetch("data/items.json"+v).then(r => r.ok ? r.json() : []).catch(() => []),
    fetch("data/meta.json"+v).then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch("data/synthese.md"+v).then(r => r.ok ? r.text() : "").catch(() => ""),
    fetch("data/resumes.json"+v).then(r => r.ok ? r.json() : {}).catch(() => ({})),
    fetch("data/exclusions.json"+v).then(r => r.ok ? r.json() : {}).catch(() => ({}))
  ]).then(([a, m, s, rs, ex]) => {
    items = a; meta = m; synthese = s.trim(); resumes = rs || {};
    ((ex && ex.fiches) || []).forEach(x => { if (x.id) st.exclus[x.id] = 1; });
    ((ex && ex.ids) || []).forEach(id => st.exclus[id] = 1);
    render(); renderGear(); envoyer(); synchroniser();
  });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
